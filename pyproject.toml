[project]
name = "tagsim"
version = "0.1.0"
description = "Asynchronous-clock pursuit-evasion simulator (How to Win a Game of Tag)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
experiments = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
